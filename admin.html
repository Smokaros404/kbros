<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kbros | Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div id="login" class="login hidden">
    <form id="loginForm" class="login-card">
      <h1>Kbros Admin</h1>
      <input type="password" id="pw" placeholder="Password" required>
      <button class="btn" type="submit">Log in</button>
      <p id="loginErr" class="err"></p>
    </form>
  </div>

  <div id="app" class="hidden">
    <header class="admin-bar">
      <strong>Kbros · Admin</strong>
      <div>
        <a href="index.html" target="_blank" class="link">View site</a>
        <button id="logout" class="btn ghost">Log out</button>
      </div>
    </header>

    <main>
      <div class="tabs">
        <button data-tab="products" class="active">Products</button>
        <button data-tab="settings">Settings</button>
      </div>

      <section id="tab-products">
        <div class="split">
          <div class="panel">
            <div class="panel-head">
              <h2>Products</h2>
              <button id="newBtn" class="btn">+ New product</button>
            </div>
            <ul id="productList" class="plist"></ul>
          </div>

          <form id="productForm" class="panel">
            <h2 id="formTitle">New product</h2>

            <label>Name
              <input name="name" required>
            </label>

            <div class="row">
              <label>Price (€)
                <input name="price" type="number" step="0.05" min="0" required>
              </label>
              <label>Category
                <select name="category" id="categorySelect"></select>
              </label>
            </div>

            <label>Ingredients <small>(comma separated)</small>
              <textarea name="ingredients" rows="3" placeholder="Espresso, milk, cocoa"></textarea>
            </label>

            <label>Photo
              <input type="file" id="photoInput" accept="image/*">
            </label>
            <img id="photoPreview" class="preview hidden" alt="Preview">

            <fieldset>
              <legend>Available on</legend>
              <div class="days" id="dayChecks"></div>
              <div class="row">
                <label>From <input type="time" name="from" value="08:00"></label>
                <label>To <input type="time" name="to" value="20:00"></label>
              </div>
            </fieldset>

            <div class="actions">
              <button class="btn" type="submit">Save product</button>
              <button class="btn ghost" type="button" id="cancelBtn">Cancel</button>
            </div>
          </form>
        </div>
      </section>

      <section id="tab-settings" class="hidden">
        <form id="settingsForm" class="panel wide">
          <h2>Business info</h2>
          <div class="row">
            <label>Name <input name="name"></label>
            <label>Tagline <input name="tagline"></label>
          </div>
          <div class="row">
            <label>Address <input name="address"></label>
            <label>Phone <input name="phone"></label>
          </div>
          <div class="row">
            <label>Email <input name="email"></label>
            <label>Instagram <input name="instagram" placeholder="@kbros"></label>
          </div>
          <div class="row">
            <label>Latitude <input name="lat" type="number" step="any"></label>
            <label>Longitude <input name="lng" type="number" step="any"></label>
          </div>
          <small class="hint">Tip: in Google Maps, right-click your location and copy the coordinates.</small>

          <label>About text <textarea name="about" rows="4" placeholder="Tell customers about your cantina"></textarea></label>

          <h2>Opening hours</h2>
          <table class="hours-edit" id="hoursEdit"></table>

          <h2>Change admin password</h2>
          <label>New password <input name="newPw" type="password" placeholder="Leave empty to keep"></label>

          <div class="actions">
            <button class="btn" type="submit">Save settings</button>
            <span id="saved" class="ok-msg hidden">Saved</span>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
